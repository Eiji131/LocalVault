<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Password Saver</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔒</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <link rel="manifest" href="manifest.json">
    <!-- QR Code Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode/1.5.1/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/otpauth/9.2.1/otpauth.umd.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="dark-theme">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
                <a class="navbar-brand" id="brand" role="button" tabindex="0"
                    data-bs-toggle="popover" data-bs-trigger="hover focus" data-bs-placement="bottom"
                    title="About this app"
                    data-bs-content="Local Password Vault stores your passwords only in this browser. Data never leaves your device and there is no server-side sync or transmission over the internet.">
                <i class="fas fa-vault fa-lg me-2"></i>
                Local Password Vault
            </a>
            <div class="ms-auto d-flex gap-2">
                <button id="themeToggleBtn" class="btn btn-outline-light btn-sm" title="Switch to Light Mode">
                    <i class="fas fa-sun"></i>
                </button>
                <button id="installAppBtn" class="btn btn-outline-light btn-sm" style="display: none;">
                    <i class="fas fa-download"></i> Install App
                </button>
            </div>
        </div>
    </nav>

    <!-- Desktop Layout Wrapper -->
    <div class="desktop-layout">
        
        <!-- Left Sidebar: Inputs & Tools -->
        <aside class="sidebar-panel">
            <h5 class="mb-3 text-primary"><i class="fas fa-plus-circle"></i> Add New Entry</h5>
            
            <div class="input-group mb-3">
                <span class="input-group-text"><i class="fas fa-globe"></i></span>
                <div class="form-floating">
                    <input type="text" class="form-control" id="website" placeholder="e.g., Google, Amazon" required>
                    <label for="website">Website</label>
                </div>
            </div>

            <div class="input-group mb-3">
                <span class="input-group-text"><i class="fas fa-user"></i></span>
                <div class="form-floating">
                    <input type="text" class="form-control" id="username" placeholder="Username/Email" required>
                    <label for="username">Username</label>
                </div>
            </div>
            
            <div class="input-group mb-3">
                <span class="input-group-text"><i class="fas fa-lock"></i></span>
                <div class="form-floating">
                    <input type="password" class="form-control" id="password" placeholder="Password" required>
                    <label for="password">Password</label>
                </div>
                <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                    <i class="fa-solid fa-eye"></i>
                </button>
            </div>

            <button id="saveButton" class="btn btn-primary w-100 mb-4" disabled>Save Entry</button>

            <hr class="text-secondary">
            
            <h6 class="mb-3 text-secondary">Data Management</h6>
            <div class="d-grid gap-2">
                <button id="securedImportButton" class="btn btn-outline-info btn-sm text-start"><i class="fas fa-file-import me-2"></i> Import Data</button>
                <button id="securedExportButton" class="btn btn-outline-success btn-sm text-start"><i class="fas fa-file-export me-2"></i> Export Data</button>
                <button id="clearButton" class="btn btn-outline-danger btn-sm text-start"><i class="fas fa-trash-alt me-2"></i> Clear All Data</button>
                <input type="file" id="importFile" accept=".secured" style="display: none;">
            </div>
        </aside>

        <!-- Main Content: Search & Table -->
        <main class="main-panel">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4 class="m-0"><i class="fas fa-list"></i> Vault Items</h4>
                <div class="input-group" style="max-width: 400px;">
                    <span class="input-group-text"><i class="fas fa-search"></i></span>
                    <input type="text" class="form-control" id="searchBar" placeholder="Search accounts...">
                    <button class="btn btn-outline-secondary" type="button" id="clearSearchButton" style="display: none;">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            </div>
            
            <div class="table-responsive rounded shadow-sm">
                <table id="passwordTable" class="table table-striped table-bordered mb-0">
                    <thead>
                        <tr>
                            <th data-sort="website">Website 🌐</th>
                            <th data-sort="username">Username 👤</th>
                            <th>Password 🔑</th>
                            <th class="action-cell">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="passwordTableBody">
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- Clear Modal -->
    <div id="clearModal" class="modal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title text-danger">CONFIRM DATA DELETION</h5>
                    <button type="button" class="btn-close close-btn" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p>Are you absolutely certain you want to proceed?</p>
                    <p>This action will <strong>permanently delete ALL saved password entries</strong> from this device and <strong>cannot be undone</strong>.</p>
                </div>
                <div class="modal-footer">
                    <button type="button" id="modalCancel" class="btn btn-secondary cancel-btn">Cancel</button>
                    <button type="button" id="modalConfirm" class="btn btn-danger confirm-btn">Confirm Deletion</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div id="editModal" class="modal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Edit Entry</h5>
                    <button type="button" class="btn-close edit-close" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="input-group mb-3">
                        <span class="input-group-text"><i class="fas fa-globe"></i></span>
                        <div class="form-floating">
                            <input type="text" class="form-control" id="editWebsite" placeholder="Website/Service">
                            <label for="editWebsite">Website/Service:</label>
                        </div>
                    </div>
                    <div class="input-group mb-3">
                        <span class="input-group-text"><i class="fas fa-user"></i></span>
                        <div class="form-floating">
                            <input type="text" class="form-control" id="editUsername" placeholder="Username/Email">
                            <label for="editUsername">Username/Email:</label>
                        </div>
                    </div>
                    <div class="input-group mb-3">
                        <span class="input-group-text"><i class="fas fa-lock"></i></span>
                        <div class="form-floating">
                            <input type="password" class="form-control" id="editPassword" placeholder="Password">
                            <label for="editPassword">Password:</label>
                        </div>
                        <button class="btn btn-outline-secondary" type="button" id="toggleEditPassword">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                    <input type="hidden" id="editEntryId">
                </div>
                <div class="modal-footer">
                    <button type="button" id="editCancel" class="btn btn-secondary cancel-btn">Cancel</button>
                    <button type="button" id="editSave" class="btn btn-primary confirm-btn">Save Changes</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Security Lock Screen -->
    <div id="lockScreen">
        <div id="lockContent" class="text-center p-4">
            <!-- Content injected by JS -->
        </div>
    </div>

    <script src="script.js"></script>
    <!-- Bootstrap JS bundle (Popper included) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
    

    <!-- Toast container for save notifications -->
    <div id="toastContainer" class="position-fixed top-0 end-0 p-3" style="z-index: 1080;">
        <!-- Dynamic toasts will be appended here -->
    </div>
</body>
</html>
